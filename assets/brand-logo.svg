<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Han An Hua Foundation</title>
  <desc id="desc">Emblem with the Chinese characters Han, An, and Hua.</desc>
  <defs>
    <linearGradient id="g" x1="20" y1="15" x2="140" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4d17a"/>
      <stop offset="1" stop-color="#c98b31"/>
    </linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#020b18" flood-opacity=".28"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <circle cx="80" cy="80" r="70" fill="#07182f" stroke="url(#g)" stroke-width="5"/>
    <circle cx="80" cy="80" r="58" fill="none" stroke="#f1d58e" stroke-opacity=".42" stroke-width="1.5"/>
    <path d="M43 105c17-17 31-22 43-17 11 4 18 2 31-12" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
    <path d="M42 116c17-11 33-12 48-4 9 5 18 4 29-3" fill="none" stroke="#f2d58c" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="48" y="34" width="64" height="54" rx="12" fill="#a92f35" stroke="#f2d58c" stroke-width="2"/>
    <text x="80" y="58" text-anchor="middle" font-family="Noto Serif CJK TC, Noto Serif TC, PMingLiU, serif" font-size="24" font-weight="700" fill="#fff7dd">韓</text>
    <text x="64" y="80" text-anchor="middle" font-family="Noto Serif CJK TC, Noto Serif TC, PMingLiU, serif" font-size="21" font-weight="700" fill="#fff7dd">安</text>
    <text x="96" y="80" text-anchor="middle" font-family="Noto Serif CJK TC, Noto Serif TC, PMingLiU, serif" font-size="21" font-weight="700" fill="#fff7dd">華</text>
    <circle cx="80" cy="128" r="3.5" fill="#e4b859"/>
  </g>
